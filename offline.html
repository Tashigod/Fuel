<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>You're Offline</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f5f7fa;
}

.container{
    text-align:center;
    max-width:420px;
    padding:30px;
}

.icon{
    font-size:70px;
    margin-bottom:20px;
}

h1{
    color:#0d6efd;
    margin-bottom:15px;
}

p{
    color:#555;
    line-height:1.6;
    margin-bottom:25px;
}

button{
    background:#0d6efd;
    color:white;
    border:none;
    border-radius:10px;
    padding:14px 28px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#0b5ed7;
}
</style>

</head>

<body>

<div class="container">

<div class="icon">⛽</div>

<h1>You're Offline</h1>

<p>
Your internet connection appears to be unavailable.
Reconnect to continue placing fuel orders.
</p>

<button onclick="location.reload()">
Try Again
</button>

</div>

</body>
</html>
