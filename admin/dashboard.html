<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fuel Admin Dashboard</title>

<link rel="stylesheet" href="admin.css">
</head>

<body>

<div class="dashboard">

    <header class="topbar">

        <h1>Fuel Admin Dashboard</h1>

        <div>

            Welcome,
            <strong id="adminName"></strong>

            <button id="logoutBtn">
                Logout
            </button>

        </div>

    </header>

    <section class="stats">

        <div class="card">
            <h3>Total Orders</h3>
            <h2 id="totalOrders">0</h2>
        </div>


        <div class="card">
            <h3>Total Revenue</h3>
            <h2 id="totalRevenue">₦0</h2>
        </div>


        <div class="card">
            <h3>Pending Orders</h3>
            <h2 id="pendingOrders">0</h2>
        </div>


        <div class="card">
            <h3>Delivered Orders</h3>
            <h2 id="deliveredOrders">0</h2>
        </div>


        <div class="card">
            <h3>Total Customers</h3>
            <h2 id="totalCustomers">0</h2>
        </div>


    </section>

    <section class="orders">

        <h2>Orders</h2>

        <table>

            <thead>

                <tr>

                    <th>ID</th>
                    <th>Customer</th>
                    <th>Products</th>
                    <th>Total</th>
                    <th>Date</th>
                    <th>Status</th>
                    <th>Actions</th>

                </tr>

            </thead>

            <tbody id="ordersTable">

            </tbody>

        </table>

    </section>
    <section class="products">

        <h2>Product Management</h2>

        <table>

            <thead>

                <tr>

                    <th>Product</th>
                    <th>Unit</th>
                    <th>Price</th>
                    <th>Action</th>

                </tr>

            </thead>

            <tbody id="productsTable">

            </tbody>

        </table>

</section>

</div>
<div id="orderModal" class="modal">

    <div class="modal-content">

        <span id="closeModal">
            ✖
        </span>

        <h2>Order Details</h2>

        <div id="orderDetails"></div>

    </div>

</div>


<script src="dashboard.js"></script>

</body>
</html>
