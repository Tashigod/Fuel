<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fuel Admin Dashboard</title>

<link rel="stylesheet" href="admin.css">
</head>

<body>

<div class="dashboard">

    <header class="topbar">

        <h1>Fuel Admin Dashboard</h1>

        <div>

            Welcome,
            <strong id="adminName"></strong>

            <button id="logoutBtn">
                Logout
            </button>

        </div>

    </header>

    <section class="stats">

        <div class="card">
            <h3>Total Orders</h3>
            <h2 id="totalOrders">0</h2>
        </div>

        <div class="card">
            <h3>Total Revenue</h3>
            <h2 id="totalRevenue">₦0</h2>
        </div>

    </section>

    <section class="orders">

        <h2>Orders</h2>

        <table>

            <thead>

                <tr>

                    <th>ID</th>
                    <th>Customer</th>
                    <th>Total</th>
                    <th>Date</th>
                    <th>Status</th>
                    <th></th>

                </tr>

            </thead>

            <tbody id="ordersTable">

            </tbody>

        </table>

    </section>

</div>

<script src="dashboard.js"></script>

</body>
</html>
